name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Unzip project
      run: unzip -o "RainbowClient (1).zip"
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Fix and Build
      run: |
        # تصليح ملف التصميم
        rm -f RainbowClient/app/src/main/res/layout/actividad_principal.xml
        mkdir -p RainbowClient/app/src/main/res/layout
        echo '<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"></RelativeLayout>' > RainbowClient/app/src/main/res/layout/actividad_principal.xml
        
        # تصليح ملف SocketService
        sed -i 's/Map<String, String> headers = new HashMap<>();/Map<String, List<String>> headers = new HashMap<>();/' RainbowClient/app/src/main/java/com/ejemplo/rainbowclient/SocketService.java
        sed -i 's/headers.put("user-agent", Build.MANUFACTURER + " " + Build.MODEL + " | Android " + Build.VERSION.RELEASE);/headers.put("user-agent", Arrays.asList(Build.MANUFACTURER + " " + Build.MODEL + " | Android " + Build.VERSION.RELEASE));/' RainbowClient/app/src/main/java/com/ejemplo/rainbowclient/SocketService.java
        sed -i '2i import java.util.List;\nimport java.util.Arrays;' RainbowClient/app/src/main/java/com/ejemplo/rainbowclient/SocketService.java
        
        # كتابة build.gradle.kts صح
        cat > RainbowClient/app/build.gradle.kts << 'EOF'
        plugins {
            id("com.android.application")
        }

        android {
            namespace = "com.rainbow.client"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.rainbow.client"
                minSdk = 24
                targetSdk = 34
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation("io.socket:socket.io-client:2.1.0") {
                exclude(group = "org.json", module = "json")
            }
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("androidx.core:core:1.12.0")
        }

        configurations.all {
            resolutionStrategy {
                force("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
                force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
            }
        }
        EOF
        
        # البناء
        cd "RainbowClient"
        gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "RainbowClient/app/build/outputs/apk/debug/app-debug.apk"
