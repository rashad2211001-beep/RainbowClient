name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Unzip project
      run: unzip -o "RainbowClient (1).zip"
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Fix Layout File (Remove missing strings)
      run: |
        rm -f "RainbowClient/app/src/main/res/layout/actividad_principal.xml"
    - name: Build with Gradle
      run: |
        cd "RainbowClient"
        gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "RainbowClient/app/build/outputs/apk/debug/app-debug.apk"
